<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="exposure-triangle-title">
	<title id="exposure-triangle-title">The exposure triangle: aperture, shutter speed, and ISO, all meeting at exposure</title>

	<!-- triangle connecting the three settings -->
	<line x1="320" y1="130" x2="140" y2="430" stroke="oklch(59.23% 0.0631 54.17)" stroke-width="3" stroke-linecap="round" />
	<line x1="320" y1="130" x2="500" y2="430" stroke="oklch(59.23% 0.0631 54.17)" stroke-width="3" stroke-linecap="round" />
	<line x1="140" y1="430" x2="500" y2="430" stroke="oklch(59.23% 0.0631 54.17)" stroke-width="3" stroke-linecap="round" />

	<!-- center: exposure -->
	<circle cx="320" cy="330" r="54" fill="oklch(97.46% 0.0051 67.76)" stroke="oklch(59.23% 0.0631 54.17)" stroke-width="2.5" />
	<text x="320" y="325" text-anchor="middle" font-family="serif" font-size="20" font-weight="600" fill="oklch(39.63% 0.0349 45.6)">Exposure</text>
	<text x="320" y="346" text-anchor="middle" font-family="sans-serif" font-size="11" fill="oklch(47.84% 0 0)">all three, balanced</text>

	<!-- top vertex: aperture -->
	<circle cx="320" cy="130" r="46" fill="oklch(94.4% 0.0115 84.58)" stroke="oklch(59.23% 0.0631 54.17)" stroke-width="2.5" />
	<polygon points="320,98 347,114 347,146 320,162 293,146 293,114"
		fill="none" stroke="oklch(39.63% 0.0349 45.6)" stroke-width="2.5" stroke-linejoin="round" />
	<circle cx="320" cy="130" r="10" fill="oklch(39.63% 0.0349 45.6)" />
	<text x="320" y="204" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="oklch(33.29% 0 0)">APERTURE</text>
	<text x="320" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="oklch(47.84% 0 0)">f/1.4 – f/16</text>
	<text x="320" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="oklch(47.84% 0 0)">light + depth of field</text>

	<!-- bottom-left vertex: shutter speed -->
	<circle cx="140" cy="430" r="46" fill="oklch(94.4% 0.0115 84.58)" stroke="oklch(59.23% 0.0631 54.17)" stroke-width="2.5" />
	<circle cx="150" cy="430" r="7" fill="oklch(39.63% 0.0349 45.6)" />
	<line x1="130" y1="430" x2="105" y2="430" stroke="oklch(39.63% 0.0349 45.6)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
	<line x1="130" y1="418" x2="112" y2="418" stroke="oklch(39.63% 0.0349 45.6)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
	<line x1="130" y1="442" x2="112" y2="442" stroke="oklch(39.63% 0.0349 45.6)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
	<text x="140" y="504" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="oklch(33.29% 0 0)">SHUTTER SPEED</text>
	<text x="140" y="526" text-anchor="middle" font-family="sans-serif" font-size="12" fill="oklch(47.84% 0 0)">1/1000s – 1s</text>
	<text x="140" y="542" text-anchor="middle" font-family="sans-serif" font-size="12" fill="oklch(47.84% 0 0)">light + motion</text>

	<!-- bottom-right vertex: ISO -->
	<circle cx="500" cy="430" r="46" fill="oklch(94.4% 0.0115 84.58)" stroke="oklch(59.23% 0.0631 54.17)" stroke-width="2.5" />
	<g fill="oklch(39.63% 0.0349 45.6)">
		<circle cx="483" cy="415" r="3.5" />
		<circle cx="500" cy="410" r="3.5" />
		<circle cx="516" cy="418" r="3.5" />
		<circle cx="488" cy="432" r="3.5" />
		<circle cx="508" cy="435" r="3.5" />
		<circle cx="495" cy="448" r="3.5" />
		<circle cx="514" cy="445" r="3.5" />
		<circle cx="478" cy="440" r="3.5" />
	</g>
	<text x="500" y="504" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="oklch(33.29% 0 0)">ISO</text>
	<text x="500" y="526" text-anchor="middle" font-family="sans-serif" font-size="12" fill="oklch(47.84% 0 0)">fixed per roll</text>
	<text x="500" y="542" text-anchor="middle" font-family="sans-serif" font-size="12" fill="oklch(47.84% 0 0)">sensitivity + grain</text>
</svg>
